# ---------- 主人公と 恋人 ----------
[[established]]
content = "主人公は 18さい いじょう。ゲームの 中で 年は 言わない"
source = "メモ protagonist-adult"
status = "confirmed"

[[established]]
content = "ミオは 主人公の 家に いる 年上の 女性。血縁では ない 同棲相手で 恋人。古い 呼び名（おねえちゃん・ミサキ）は 使わない"
source = "メモ protagonist-adult"
status = "confirmed"

[[established]]
content = "ナナミ（グリーンの 姉）も 主人公の 恋人。ミオも ナナミも 大人の 恋愛関係だが、台詞は におわせる 程度"
source = "メモ protagonist-adult / nanami-lore"
status = "confirmed"

[[established]]
content = "ナナミは じつは こくさいけいさつ で、ダークポケモンを おって いる。名のる ときは「こくさいけいさつです！」"
source = "メモ nanami-lore、Route9_Frlg、PowerPlant_Frlg"
status = "confirmed"

[[established]]
content = "ナナミが こくさいけいさつだと 主人公に 明かすのは 9ばんどうろ（フリーザーの 場面）。それまでの リバティガーデンでは けいかんとの 間がらを きかれても はぐらかす。べっそう（BattleFrontier_ScottsHouse_Frlg）は 明かす まえに 来ても あとに 来ても 通じる よう「ここが わたしの きょてん」と だけ 言う"
source = "ユーザーの 指示（2026-11-16）、Route9_Frlg（NanamiPolice・NanamiTakesGrunt）、LibertyGarden_Exterior_Frlg（NanamiLeave）"
status = "confirmed"

[[established]]
content = "ナナミは 恋人だが、口説き文句や 夜・へやを におわせる 言い方は 入れない（ユーザー「消しちゃっても いいよ なんか 変だし」）。グリーンの いえ 1F の ナナミは 公式の 型（あいさつ・ポケモンの 話・けづくろい・なつき度）で 話す。2F の ナナミの へや（ビクティニの 旅の まえに やすむ 場面・パソコン・てがみ・カレンダー・ベッド）には この 決まりを 当てはめない（ユーザー 2026-11-18）。デートや 電話で 恋人と わかる ことは のこす。家で まつ・テレビを みて なくのは ミオの 役"
source = "ユーザーの 指示（2026-11-16）"
status = "confirmed"

[[established]]
content = "ナナミの 拠点は バトルフロンティアの べっそう（もとの エニシダの 家、BattleFrontier_ScottsHouse_Frlg）。ちかしつに ろうや が あり、たおした ダークポケモンが おくられる"
source = "メモ nanami-lore / pending-decisions、BattleFrontier_ScottsHouse_Frlg"
status = "confirmed"

[[established]]
content = "ナナミと エニシダは ビジネスフレンズ。フロンティアの 道具（BP・シールドなど）は エニシダに たのまれて ナナミが わたす。エニシダ本人は 出てこない"
source = "メモ nanami-lore"
status = "confirmed"

[[established]]
content = "ナナミは バッジの たびに デートに さそう（ポケモンセンターの まえで まつ → 勝負）。勝負では 主人公と ライバルが 使わなかった ポケモンを 使う"
source = "data/scripts/nanami_dates.inc、メモ pending-decisions"
status = "confirmed"

# ---------- ロケットだん ----------
[[established]]
content = "ロケットだんの かんぶは アポロ・ランス・アテナの 3人（やけたとうで そろって 出る）。アポロが まとめ役"
source = "MiyabiCity_BurnedTower_B1F"
status = "confirmed"

[[established]]
content = "前の 版の かんぶ ユキメ（ふたごじま）・カゲロウ（ルギアの どうくつ）は いない。フリーザーは 9ばんで アテナ、ルギアは めざめのほこらで ランスに おきかわった"
source = "Route9_Frlg、OasisTown_ShrineB1F、トレーナー表に ユキメ・カゲロウが ない"
status = "confirmed"

[[established]]
content = "ボスは サカキ。したっぱ・けんきゅういんは「サカキさま」と よぶ。サカキの 手持ちの さいごは ダークの 三犬（アジト ライコウ・シルフ エンテイ・トキワジム スイクン）"
source = "PowerPlant_Frlg（ScientistGivesUp）、メモ pending-decisions"
status = "confirmed"

[[established]]
content = "やけたとうの ちかの 三犬（エンテイ・スイクン・ライコウ）は ロケットだんに つれさられた。ナナミは「3びきは かならず とりかえそう」と 言った"
source = "MiyabiCity_BurnedTower_1F / B1F"
status = "confirmed"

[[established]]
content = "カエデの やけたとうの 事件には ミオでは なく カスミが 出る。カスミは ロケットだんを おって ジムを あけ、ナナミより さきに カエデに いた。グリーンは ナナミに よばれて 来た。おわると カスミは「ジムで まってる」と ハナダに もどる"
source = "MiyabiCity_BurnedTower_1F / B1F（2026-11-15 に ミオから かえた）"
status = "proposed"

[[established]]
content = "物語の 順番は おつきみやま → ハナダ → カエデ（やけたとう）→ ハナダジム → クチバ。やけたとうが おわるまで カスミは るすで、ハナダジムの まえに おんなのこが 立って いる（VAR_BURNED_TOWER_STATE が 4 か バッジ2で きえる）"
source = "CeruleanCity_Frlg（GymGirl）、CeruleanCity_Gym_Frlg（MistyIntro）"
status = "proposed"

[[established]]
content = "シルバーは やけたとうで ロケットだんの 側に 立った（「ロケットだんの しごとの じゃまだ」）。サカキとの 関係は 台本に まだ 出て いない"
source = "MiyabiCity_BurnedTower_1F"
status = "confirmed"

[[established]]
content = "はつでんしょの サンダーの 場面（ライデン・ナナミ・ダーク・サンダー）は 2026-11-15 に けした。サンダーは ロケットだんに さらわれた ことに なって いて、イワヤマトンネルの 北の 入り口で おまわりさんが「しらべて いる」と 言う だけ。続きの 話は まだ ない（書かない）"
source = "PowerPlant_Frlg・Route10_Frlg（RockTunnelPoliceman）"
status = "confirmed"

[[established]]
content = "アテナは クチバの てんき けんきゅうじょで ダーク・ポワルンを 使い、9ばんで くろい オーラの フリーザーを ねらった"
source = "VermilionCity_WeatherInstitute_2F_Frlg、Route9_Frlg"
status = "confirmed"

[[established]]
content = "アテナ・ランスは やけたとうで 主人公を 見て いる。あとで 会う ときは 見覚えの ある 言い方に する（アテナ「やけたとうに いた こどもね」、ランス「やけたとうの こどもですか」）"
source = "VermilionCity_WeatherInstitute_2F_Frlg、Route9_Frlg、OasisTown_ShrineB1F"
status = "proposed"

[[established]]
content = "ランスは めざめのほこらで まけ、あなぬけのヒモで そとに でた ところを ナナミが つかまえた"
source = "OasisTown_ShrineB1F（NanamiCaught）"
status = "proposed"

# ---------- ダークポケモン ----------
[[established]]
content = "ダークポケモンは こころを とざされた ポケモン。くろい オーラ（むらさきの ほのお）を まとう"
source = "PalletTown_RivalsHouse_Frlg、Route9_Frlg、OasisTown_ShrineB1F"
status = "confirmed"

[[established]]
content = "トレーナーの ダークポケモンは スナッチボールで うばう（スナッチ）。ふつうの ボールでは とれない"
source = "PalletTown_RivalsHouse_Frlg（HowToSnag）"
status = "confirmed"

[[established]]
content = "こころを ひらく ことを 画面では「リライブ」と よぶ（わざの「じょうか」は 別）。いっしょに たたかったり あるいたり すると こころの とびらが ひらく"
source = "メモ pending-decisions、PalletTown_RivalsHouse_Frlg（HowToSnag。リライブの 説明は ここ 1回 だけ。ほかの 場面では「ヒメグマ げんき？」の ような 一言に とどめる）"
status = "confirmed"

[[established]]
content = "スナッチ しそこねた ダークポケモンは、しばらく（48歩）すると ナナミから「つかまえた」と 電話が 来る。その こは バトルフロンティアの ナナミの べっそうの ちかしつ（ろうや）に いて、あとで もう いちど 戦って スナッチ できる。電話は ニビの あと（ビクティニの 電話の あと）から 来るので、べっそうに まだ 行って いない ときでも 通じる 言い方に する"
source = "ユーザーが 2026-11-16 に きめた。src/shadow_cell.c（TryStartShadowCellCall）、data/scripts/shadow_cell.inc"
status = "confirmed"

[[established]]
content = "その場の 再戦は ない。おつきみやま・シオンセンター（タワー 4F）・ポケモンやしき・てんき けんきゅうじょ（アテナの ポワルン）も ハナダ・サントアンヌ・アジトと 同じく「にげて いった」→ ナナミが べっそうの ろうやに かくり。アテナは ポワルンが にげても ひきあげ、しょちょうは いしと なみのりを くれる"
source = "2026-11-16 ユーザーが きめた。src/shadow_cell.c"
status = "confirmed"

[[established]]
content = "ダーク・ルギアは ネレアシティ（地図名 OasisTown）の めざめのほこら の おくに いる。ナナミが わたす 1こ だけの ボールは「なげれば ぜったい はずれない」"
source = "OasisTown、OasisTown_ShrineB1F"
status = "confirmed"

