# ---------- ホウエン ----------
[[established]]
content = "ホウエンを しずめたのは カイオーガ（ふりつづく おおあめと たかなみ）。グラードン・レックウザが しずめた とは 言わない。のこったのは カイナ・ミナモ・キナギの しま だけで、うみの すいどうで むすばれて いる。ミシロ・ムロ・ルネ などは しずんだ"
source = "2026-11-16 ユーザーが きめた。VermilionCity_WeatherInstitute_1F_Frlg（WallPoster）"
status = "confirmed"

[[established]]
content = "1のしまの ネットワークマシンは「ホウエンと こうかんする きかい」では なく、しずんだ ホウエンの のこった しま（カイナ・ミナモ・キナギ）と つうしんを つなぐ そうち。ルビーと サファイアは その ために いる いし。ニシキが ルビーを たのむのは 殿堂入りの あと。つながると ホウエンの しまとの とりひき（2のしまの みせ）や れんらく（1のしまの かくとうむすめの ミナモの カレ）が できる"
source = "ユーザーが きめた 方向（2026-11-16）。OneIsland_PokemonCenter_1F_Frlg、OneIsland_Frlg、TwoIsland_Frlg"
status = "proposed"

[[established]]
content = "マサラの みなとから ふねで いける ホウエンの しまは カイナ だけ。でるのは サファイアを わたして ホウエンの しまと つうしんが つながって から（それまでは バトルフロンティアと リバティガーデン だけ）。ニシキが そのとき 教える。カイナ・109ばんの 野生は 4〜7のしまと 同じ つよさ"
source = "2026-11-16 ユーザーが「通信のあとに入れるべき」「レベルも調整するべき」「船でいけるのはカイナだけ」と きめた。PalletTown_Harbor_Frlg、OneIsland_PokemonCenter_1F_Frlg（FerryToHoennOpen）"
status = "confirmed"

[[established]]
content = "ロケットだんが ルビー・サファイアを ねらうのは、ホウエンの しまへの ただ ひとつの つうしんを にぎって しまの ひとを したがわせる ため。したっぱは「かんぶが いってた おたから」と ききかじり 程度で、かんぶと サファイアを もちさった けんきゅういんが 理由を 口に する"
source = "ユーザーが きめた 方向（2026-11-16）。FiveIsland_RocketWarehouse_Frlg（GideonIntro・Admin2PostBattle）、MtEmber_Exterior_Frlg（WellTryDiggingHere）"
status = "proposed"

[[established]]
content = "ホウエンの 歴史は てんき けんきゅうじょ 1F の かんばん 1つで 語る。しょちょう・けんきゅういん・アテナは くりかえさない"
source = "2026-11-16 台詞の 直し"
status = "proposed"

