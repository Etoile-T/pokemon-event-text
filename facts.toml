# ---------- 呼び方（まとめ） ----------
[[established]]
content = "悪役（ロケットだん・かんぶ）が 主人公を こども・ガキ と よぶのは わざと。直さない"
source = "メモ villain-calls-player-kid"
status = "confirmed"

[[established]]
content = "ナナミは 人を さん付けで よぶ。主人公は {PLAYER}{KUN}、ミオは ミオちゃん"
source = "メモ nanami-lore"
status = "confirmed"

[[established]]
content = "エリカ（バッジ4）の まえは ヤマブキへも セキチクへも いけない。ヤマブキの 4つの ゲートの おまわりさんは「ロケットだんが うろついて あぶない タマムシジムの バッジを もった トレーナーしか とおせない」（おちゃが あっても）。13ばんの 12ばんがわの はしは こわれて いて、こうじの ひと 2人が なおして いる（バッジ4で いなくなる）"
source = "2026-11-16 ユーザーが「工事中って感じ 橋が壊れてるみたいな」と きめた。Route5_SouthEntrance_Frlg（NeedRainbowBadge）、Route13_Frlg（BridgeWorker1・2）"
status = "confirmed"

[[established]]
content = "アスターシティは もともと シオンタウン。カイオーガの ぼうそうで ホウエンと カントーの ひがし はんぶんが しずんだ とき、トクサネシティから ひなんみんが きて、ポケモンタワーは いちじてきに うちゅうセンター（シオンセンター）に たてなおされた。だから センターには ポケモンの たましいが ねむって いて ゆうれいが でる。いまは なくなった ポケモンを ロケットで ほしへ おくる（うちゅうそう）。ロケットだんが いすわって うちあげが とまり、ほしへ いけない ガラガラの たましいが さまよって いた。フジは いのりに きた"
source = "2026-11-16 ユーザーが きめた（「元々シオンタウン…トクサネから避難民…タワーは一時的に宇宙センターとして建て直された」、宇宙葬を えらんだ）。LavenderTown_House3_Frlg（WatchStars）、LavenderTown_SionCenter_1F/2F_Frlg、LavenderTown_Frlg"
status = "confirmed"

[[established]]
content = "タマムシの アジト 地下 4かいで アポロ（みぎ）と ランス（ひだり、ていねい語）を たおすと、まんなかの ワープの ゆかで ロケットだんの アリーナへ。サカキは ライコウを ボールから だし「やけたとうの ライコウ… その ちからを さらに ひきだす ため… いま さいごの ちょうせいを して いる ところだ」と 言って、そうちの レーザーで 3かい ちからを そそぐ（3かいめで 紫の 炎を まとう）。「こころを とざした ポケモンは… その ちからを ぞんぶんに ふるう」「…その ちから きみで ためすと しよう」で 勝負。ライコウは 手持ちの さいご。スナッチ できたら「ふッ… その ちから おぼえて おこう」、ナナミから でんわ。しそこねたら ライコウは かべを やぶって にげ、ナナミの べっそうの ろうやへ（「まあ いい いずれ また われわれの ものに なる」）。サカキは スピアーに どくガスを はかせて きえ、シルフスコープが のこる"
source = "2026-11-17 ユーザーが きめた（「無言でライコウぶん投げてくるのがアレ」「去っていくときはスピアーで毒ガス」「手前の二人を幹部の女以外の二人に」「最終調整をしているところだにしよう」「レーザーを三回に」）。RocketHideout_B4F_Frlg・RocketHideout_Arena_Frlg、docs/scenes/rocket_hideout_giovanni.md"
status = "confirmed"

[[established]]
content = "シルフ 11かいの サカキは「…また きみか」と いい、ダーク・エンテイを ボールから 見せてから 勝負する。アジトの ライコウを スナッチ したかで ひとこと かわる。スナッチ できたら「…エンテイまで うばいとるか」、しそこねたら エンテイは まどを やぶって にげる（ナナミの べっそうの ろうやへ）。さいごに「…シルフは あきらめると しよう だが われわれは きえは しない」"
source = "2026-11-18 ユーザーが ねて いる あいだに Claude が 作った（ユーザーの 確認 まだ）。SilphCo_11F_Frlg、docs/scenes/giovanni_silph_viridian.md"
status = "proposed"

[[established]]
content = "トキワジムの サカキは ダーク・スイクンを 見せてから ジムリーダーと して 勝負する。勝った あと「ロケットだんは かいさん」とは 言わず「わたしは ロケットだんを はなれる」「のこった ぶかが どう うごくかは わからん」と 去る。だから ネレアの ランスは「サカキさまが いなくなっても わたしたちは とまりませんよ」と 動いて いる"
source = "2026-11-18 ユーザーが ねて いる あいだに Claude が 作った（ユーザーの 確認 まだ）。ViridianCity_Gym_Frlg、OasisTown_ShrineB1F"
status = "proposed"


[[established]]
content = "ナナミが くれる しあわせタマゴは、ネレアで「ちゃんと おれい させてね」と 約束した おれい。ナナミの 家で「ネレアでは ほんとうに ありがとう」「こくさいけいさつの なかまも みんな おどろいてたわ」と わたす"
source = "2026-11-18 仮の 台詞を 差しかえた とき（ユーザーの 確認 まだ）。PalletTown_RivalsHouse_Frlg の LugiaThanks"
status = "proposed"

[[established]]
content = "ビクティニの 旅の まえ、ナナミの へやで やすむ 場面で、ナナミは ニビで さそった とき ことわられないか どきどき して いたと 打ちあける（ニビの「ことわっても だめだからね」の うらがえし）"
source = "2026-11-18 仮の 台詞を 差しかえた とき（ユーザーの 確認 まだ）。PalletTown_RivalsHouse_2F_Frlg"
