# 禁止語・言いすぎの 言葉（scripts/check_event_text.py が 読む）
# 台本は ひらがなの 分かち書きなので、ひらがなで 書く。空白は 無視して くらべる。
# level: ERROR = かならず 直す / WARN = 読みかえして、要らなければ 消す
# anywhere = true の 組は 文節の とちゅうからでも 照らす（「〜と いう ことは」の「と」は 前の 文節に つく）。
#   ない 組は 文節の 頭から だけ（「いじょう かち」を「じょうか」と とらない ため）。
# 一つ 出た だけで AI っぽいとは かぎらない。まとまって 出たら 書きなおす（humanizer の 考え方）。
# 公式（日本語版 FR）の 台詞での 数を why に 書いた（find_official.py --grep で 数えた。2026-11-15）。
# 公式でも 使う 言葉は「その 場面で ほんとうに いるか」を 見る ための 注意で、禁止では ない。
#
# 出典: 「ai」「humanizer」の 組は harupan119/claude-skills-ja の
# skills/humanizer-ja-modes/references/banned-ja.md（MIT）から、ゲームの 台詞で 出そうな ものを
# えらび、かなに なおした もの。LICENSES.md を 見る。

[[group]]
name = "説明くさい"
level = "WARN"
why = "事情や 仕組みを 台詞で 説明して いる。行動や 短い ひとことに かえる（公式でも「つまり」7回。はかせや 説明役だけ）"
words = [
  "つまり", "ようするに", "なぜなら", "しくみ",
  "おなじ ちから", "せつめい すると", "かんたんに いうと",
]

[[group]]
name = "説明くさい（つなぎ）"
level = "WARN"
anywhere = true
why = "理由や 結論を ことばで つなぐ 説明の 型。台詞では たいてい いらない（公式は ぜんぶで 7回）"
words = ["と いう ことは", "と いう わけ", "と いうのも", "なのである"]

[[group]]
name = "決めぜりふの 型"
level = "WARN"
why = "どの 人物でも 言える 決まり文句。その 人の 言葉に するか、けずる"
words = [
  "かけがえのない", "きせき", "うんめい", "たいせつなのは", "ほんとうにたいせつな",
  "しんじることが", "こころのつよさ", "あらたなたび", "あたらしいたびが",
  "わすれないで", "いつだってそばに", "きずなのちから",
]

[[group]]
name = "humanizer（AI の 定型語）"
level = "WARN"
why = "AI の 文に 多い 言い回し（banned-ja.md より）。ゲームの 台詞では まず 使わない"
words = [
  "うきぼり", "ちゅうもくにあたいする", "ふかけつ", "きわめてじゅうよう",
  "かくめいてき", "あっとうてき", "いうまでもなく", "けっきょくのところ",
  "ほんしつてきには", "これにより", "しかしながら", "することができる",
  "おやくにたてれば", "いかがでしたか", "もちろんです",
]

[[group]]
name = "このゲームの 言葉"
level = "WARN"
why = "ゲームの 中の 呼び名と ちがう。画面の 言葉は「リライブ」「ダークポケモン」（わざの じょうか なら そのまま）"
words = ["じょうか", "シャドーポケモン", "シャドウポケモン"]

[[group]]
name = "公式に ない 言い方"
level = "WARN"
why = "日本語版 FR の 台詞に 1回も ない 形。公式の 言い方に よせる（くそっ → くそう・くそ！・ちくしょう）"
words = ["くそっ"]
