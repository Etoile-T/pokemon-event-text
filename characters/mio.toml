# ミオ（主人公の 家に いる 年上の 女性。血縁では ない 同棲相手）
# 主人公の 家（PalletTown_PlayersHouse_*）の 台本は 読んで いない。家の 台詞を 書く ときは、
# ユーザーに 見せて もらうか、ユーザーに 書いて もらう。
# 出典: ViridianForest_Frlg（MioCall）、data/text/match_call.inc（Mio1〜3）、
#       MiyabiCity_BurnedTower_1F / B1F、メモ protagonist-adult
# 名前の ゆらい: おねえちゃん → ミサキ → ミオ（2026-11-03）。古い 呼び名は 使わない。
# 注意: data/text/trainers.inc の「ミオ『あたしたち ふたご…」は エメラルドの ふたごの トレーナーで、別人。

id = "mio"
name = "ミオ"
role = "主人公と くらす 年上の 恋人。家を まもって 帰りを 待つ"
screen_time = "lead"
flaw = "さみしさを 言わずに 明るく ふるまい、あとで まとめて あふれる"
quirk = "電話の さいしょに 名のる（「もしもし？ ミオだよ」）"
heat = "主人公が けがなく 家に 帰って くる こと"

[voice]
first_person = "わたし"
call_player = "いつも {PLAYER}{KUN}（その場でも 電話でも。2026-11-15 に きまった）"
call_others = "ナナミさん"
endings = ["〜だよ", "〜ね", "〜からね", "〜てよね", "〜しようね"]
catchphrases = ["もしもし？ ミオだよ", "いえで まってるからね", "むちゃは だめだよ", "けが してない？"]
length = "とても 短い。1ページ 1行が 多い。電話でも 3ページまで"
emotion = "おどろきや 安心は「……」を 2つ 重ねて 間を とる（「まにあった……！」「……きえちゃった」）。うれしい ときは すなおに「うれしい！」"
romance = "大人の 恋人。におわせる 程度に とどめ、露骨な 表現は しない"

[[relations]]
target = "主人公"
kind = "同棲して いる 恋人（年上）"
emotion = "心配と 帰りを 待つ 気持ち。ついて 行く ときは 足を 引っぱらない"

[[relations]]
target = "ナナミ"
kind = "主人公を めぐる 年上どうし。話は 通じあう"
call = "ナナミさん"

[[relations]]
target = "グリーン"
kind = "顔見知り。やけたとうでは いっしょに 来る"
emotion = "グリーンからは「ミオさん」"

[dont]
list = [
  "家の 外で 戦いの 話を 長く しない",
  "自分の さみしさを 長く 語らない（1ことで にじませる）",
  "あたし・〜です の 口調（エメラルドの ふたごの ミオと まざる）",
]

[open]
list = []

[check]
tags = ["ミオ"]
ng_words = ["おれ", "ぼく", "ガキ", "だぜ", "あたし"]
