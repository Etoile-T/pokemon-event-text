# カスミ（ハナダシティの ジムリーダー。みずタイプ）
# [official] は 日本語版 FR の 台詞 6件（find_official.py --speaker カスミ。ハナダジムの 勝負の まえ・負け・バッジと わざマシンの 説明）。
#   改造の ハナダジムでも「負け」「バッジの 説明」は この 公式の 文が ビルドで 入る（わたしの まけね …）。
# [project] は この 改造で 足した こと（やけたとうの 事件、再戦、電話）。
# 改造の 台本: MiyabiCity_BurnedTower_1F / B1F、CeruleanCity_Gym_Frlg（MistyIntro・MistyRematch*）、
#   data/scripts/leader_rematch.inc（とうろくの でんわ）、data/text/match_call.inc（MistyFrlg1〜2）、CeruleanCity_Frlg（GymGirl）

id = "misty"
name = "カスミ"
role = "ハナダジムの ジムリーダー"
screen_time = "support"

[official]
source = "日本語版 FR 6件"
first_person = "わたし（4。あたし は 0）"
call_player = "きみ・あなた（名前では 呼ばない）"
endings = ["〜の（なれるの・おしえるの）", "〜わ（きくわ・つかえるわ）", "〜ね（まけね・いっぱいね）", "〜よ（ことよ・わざマシンよ）", "〜して あげて！"]
catchphrases = ["あのね きみ！", "うーん…！", "しょうが ない！", "（みずタイプの 話で 同じ 言葉を 重ねて 熱く なる）"]
length = "1件 平均 3.2ページ、1ページ 1.9行、1行 平均 11.9字（いちばん 長くて 17字）"
emotion = "あかるく はっきり。負けても さっぱり（しょうが ない！）。みずタイプの 話に なると 熱が 入る"

[project]
role = "ロケットだんを おって ジムを あけ、カエデの やけたとうに さきに 来て いた（2026-11-15 に ミオの かわりに なった）"
flaw = "負けずぎらいで、くやしい ときほど 強がる"
quirk = "相手を はげます ときも 命令口調"
call_others = "ナナミ → ナナミさん、グリーン → あんた（名前なら {RIVAL}）"
rematch_voice = "再戦の 台本も「わたし」で 名前を 呼ばない 形に そろえた（2026-11-15）"

[conflicts]
list = []

[[relations]]
target = "主人公"
kind = "やけたとうで はじめて あう。そのあと ハナダジムで 勝負"
emotion = "なかまと して みとめるが、ジムでは 手を ぬかない"

[[relations]]
target = "ナナミ"
kind = "やけたとうで いっしょに なる。こくさいけいさつ とは 知らない ことに して おく（台本に まだ 出ない）"
call = "ナナミさん"

[[relations]]
target = "グリーン"
kind = "顔見知り。グリーンからは「カスミさん」（ユーザーが きめた）"

[dont]
list = [
  "ていねい語（〜です・〜ます）",
  "{PLAYER}{KUN} と よぶ（それは ナナミ・ミオの 呼び方）",
  "恋人を におわせる 言葉（主人公の 恋人は ナナミと ミオ）",
  "ロケットだんの 事情を 長く 説明する",
]

[open]
list = []
# 2026-11-15: 一人称は 公式の「わたし」、主人公は「きみ」「あなた」で 名前を 呼ばない、に そろえた

[check]
tags = ["カスミ"]
player_call = "{PLAYER}"
ng_words = ["おれ", "ぼく", "ガキ", "だぜ", "です", "ます", "あたし"]
