# 町の 人の 型（公式）
# 名前の ない 人は 見た目から 名札が 出る（src/data/speaker_npc_labels.h）。その 見た目ごとの 公式の 話し方。
# 数は 日本語版 FR の 台詞を 見た目で わけて 数えた もの（find_official.py --speaker <型> --stats）。
# 文の 例は find_official.py --speaker <型> --shuffle で 読む（ここには 写さない）。
# カエデの 人たち（kaede_people.toml）など 改造の 町の 人は、この 型を 手本に する。

id = "town_people"
name = "町の 人の 型"
role = "名前の ない 町の 人・道の 人"
screen_time = "minor"

[official.common]
length = "1件 1〜2ページ（平均 1.4〜1.9）、1ページ 2行、1行 平均 11〜12字"
topic = "1件で 話題は 1つ。町の うわさ・ポケモンの こつ・自分の くらしの 一場面"
call_player = "ほとんど 呼ばない。呼ぶ なら きみ（男の 人）・あなた（女の 人）"

[official.boy]
label = "おとこのこ（40件）"
first_person = "おれ・ぼく"
call_player = "きみ"
endings = ["〜んだ", "〜だよ", "〜だろ", "〜けど", "〜いよ"]

