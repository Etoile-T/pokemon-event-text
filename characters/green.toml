# グリーン（ライバル。名札は {RIVAL}『 。名前は プレイヤーが きめる）
# [official] は 日本語版 FR の 台詞 47件（find_official.py --speaker グリーン）を 数えた もの。
# [project] は この 改造で 足した こと。ぶつかる ときは [official] が 先（ユーザーが きめた ことは のこす）。
# 改造の 台本: MiyabiCity_BurnedTower_1F / B1F、PalletTown_ProfessorOaksLab_Frlg

id = "green"
name = "グリーン（{RIVAL}）"
role = "主人公の ライバル。ナナミの 弟。オーキドの 孫"
screen_time = "support"

[official]
source = "日本語版 FR 47件（オーキドの けんきゅうじょ・ハナダ・サントアンヌ・タワー・シルフ・22ばん・チャンピオン・ナナシマ）"
first_person = "おれ（27）、えらぶる ときは おれさま（6）、おれたち（2）"
call_player = "{PLAYER}（31。{KUN} は つけない）、おまえ（18）"
call_others = "オーキド → じいさん（8）・じーさん・オーキドの じいさん、ナナミ → ねえちゃん（うちの ねえちゃん）、マサキ → マサキ（大人でも 呼びすて）。ジムリーダーを 名前で 呼ぶ 台詞は 公式に ない"
endings = ["〜ぜ（いぜ・だぜ・たぜ・るぜ が いちばん 多い）", "〜って", "〜のか", "〜だよ", "〜んだ", "〜かよ", "〜じゃん", "〜ねーよ・〜ねーぜ", "〜だからな"]
catchphrases = ["よう {PLAYER}！・おう！ {PLAYER}！（会う ときの あいさつ）", "へへーん", "ひゃはは", "おれって てんさい？", "あばよ・あーばよ", "ちくしょう・くそう（くやしい とき。「くそっ」は 公式に ない）", "ばかな"]
length = "1件 平均 2.9ページ、1ページ 2.4行、1行 平均 11.6字（いちばん 長くて 18字）。勝負の あとは 長く しゃべる"
marks = "！が とても 多い（322行に 176）。のばしの ー（ねーよ・よーし）、さけびの ッ（あッ！・よおーッ！）、間の「…」"
emotion = "負けずぎらいで いばる。負けると「なんだよー！」「ちくしょう」。でも 最後は ちょっと 認める"

[project]
call_others = "カスミ → カスミ（呼びすて。公式どおり。2026-11-15 に きまった）、ミオ → ミオさん"
quirk = "あやまる ときも ぶっきらぼうに 短く 言う（「わりい ねえちゃん」）"
emotion = "照れや 心配は 命令口調で かくす（「ひとりで いくなって」）。いざと なれば 背中を あずける"

[conflicts]
list = [
  "くそっ: 公式の グリーンは「ちくしょう」「くそう」。新しい 台詞は こちらに よせる",
]

[[relations]]
target = "主人公"
kind = "ライバル・おさななじみ"
function = "contrast"

[[relations]]
target = "ナナミ"
kind = "姉"
call = "ねえちゃん"

[[relations]]
target = "オーキド"
kind = "祖父"
call = "じいさん"

[dont]
list = ["ていねい語", "長い 説明（勝負の あと だけは 公式も 長い）", "主人公に 素直に 礼を 言う（言うなら そっぽを むいて 一言）", "{PLAYER}{KUN} と 呼ぶ"]

[check]
tags = ["{RIVAL}", "グリーン"]
player_call = "{PLAYER}"
ng_words = ["わたし", "ぼく", "かしら", "ですわ"]
